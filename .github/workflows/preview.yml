name: Deploy (preview)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [preview]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'preview'

permissions:
  id-token: write
  contents: read

concurrency:
  group: iron-altar-deploy
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_REGION: us-east-2
      PREVIEW_DEPLOY_ROLE_ARN: ${{ vars.PREVIEW_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.sha || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: App checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - run: npm run build

      - name: Write deployment metadata
        env:
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          DEPLOY_PR: ${{ github.event.pull_request.number || '' }}
        run: node .github/scripts/write-deployment-metadata.mjs preview

      - name: Install and test infrastructure
        run: |
          npm ci
          npm run build
          npm test
        working-directory: infra

      - name: Synth production infrastructure
        run: npx cdk synth -c environment=prod
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PREVIEW_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy infrastructure
        run: npx cdk deploy --all -c environment=preview --require-approval never --outputs-file cdk-outputs.json
        working-directory: infra

      - name: Write auth config
        run: |
          AUTH_DOMAIN="$(aws ssm get-parameter --name /platform/auth/domain --region "$AWS_REGION" --query Parameter.Value --output text)" \
          AUTH_ISSUER="$(aws ssm get-parameter --name /platform/auth/issuer --region "$AWS_REGION" --query Parameter.Value --output text)" \
          AUTH_JWKS_URI="$(aws ssm get-parameter --name /platform/auth/jwks-uri --region "$AWS_REGION" --query Parameter.Value --output text)" \
          AUTH_CLIENT_ID="$(jq -r '.["iron-altar-preview-site"].AuthClientId' infra/cdk-outputs.json)" \
          AUTH_LOGOUT_URI="$(jq -r '.["iron-altar-preview-site"].SiteUrl' infra/cdk-outputs.json)/" \
          node .github/scripts/write-auth-config.mjs preview

      - name: Sync site to S3
        run: |
          BUCKET=$(jq -r '.["iron-altar-preview-site"].BucketName' infra/cdk-outputs.json)
          # Hashed Expo bundles are immutable.
          aws s3 sync dist/_expo/static/ "s3://${BUCKET}/_expo/static/" --delete \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else revalidates hourly, except HTML, deployment metadata, and auth config.
          aws s3 sync dist/ "s3://${BUCKET}/" --delete \
            --exclude "_expo/static/*" --exclude "index.html" --exclude "deployment.json" \
            --exclude "auth-config.json" \
            --cache-control "public, max-age=3600"
          # HTML, deployment metadata, and auth config must never be cached.
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/deployment.json "s3://${BUCKET}/deployment.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"
          aws s3 cp dist/auth-config.json "s3://${BUCKET}/auth-config.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        run: |
          DIST=$(jq -r '.["iron-altar-preview-site"].DistributionId' infra/cdk-outputs.json)
          ID=$(aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${DIST}" --id "${ID}"
